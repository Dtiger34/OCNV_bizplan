<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR · Làng Nón Chuông</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: sans-serif; }

    #overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #2C1A0E;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      color: #F5EDD6; text-align: center; padding: 24px;
    }
    #overlay.hidden { display: none; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #5C3D1E;
      border-top-color: #C9973A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text { font-size: 13px; color: #9C8670; letter-spacing: 0.1em; }

    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }
    #header-title { color: #fff; font-size: 14px; }
    #header-sub { color: #C9973A; font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; }
    #btn-back {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(0,0,0,0.5); border: none; color: #fff;
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }

    #status {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      z-index: 100; padding: 4px 16px; border-radius: 99px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
      background: rgba(0,0,0,0.6); color: #C9973A;
      transition: all 0.3s;
      white-space: nowrap;
    }
    #status.found { background: rgba(34,197,94,0.8); color: #fff; }

    #guide {
      position: fixed; bottom: 20px; left: 16px; right: 16px; z-index: 100;
      background: rgba(44,26,14,0.95); border: 1px solid rgba(201,151,58,0.5);
      border-radius: 12px; padding: 14px;
    }
    #guide-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    #guide-title { color: #F5EDD6; font-size: 12px; font-weight: 600; }
    #btn-close-guide { background: none; border: none; color: #9C8670; font-size: 16px; cursor: pointer; }
    #guide-body { display: flex; gap: 12px; align-items: flex-start; }
    #guide-img { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(201,151,58,0.4); flex-shrink: 0; }
    #guide-text { color: #C9B99A; font-size: 11px; line-height: 1.6; }

    a-scene { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>

<!-- Loading overlay -->
<div id="overlay">
  <div class="spinner"></div>
  <div id="loading-text">Đang khởi động AR...</div>
</div>

<!-- Header -->
<div id="header">
  <div>
    <div id="header-sub">AR · Image Tracking</div>
    <div id="header-title">Làng Nón Chuông</div>
  </div>
  <button id="btn-back" onclick="history.back()">✕</button>
</div>

<!-- Marker status -->
<div id="status">Hướng vào diorama</div>

<!-- Guide -->
<div id="guide">
  <div id="guide-header">
    <span id="guide-title">ℹ Cách dùng AR</span>
    <button id="btn-close-guide" onclick="document.getElementById('guide').style.display='none'">✕</button>
  </div>
  <div id="guide-body">
    <img id="guide-img" src="/models/lang-non-target.jpg" alt="target" />
    <div id="guide-text">
      Hướng camera vào mô hình diorama trông giống ảnh bên trái.<br/>
      Mô hình 3D sẽ tự hiện ra khi nhận diện được.
    </div>
  </div>
</div>

<!-- AR.js + A-Frame -->
<script>
  // Hiện lỗi lên overlay nếu script CDN fail load
  function showError(msg) {
    document.getElementById('loading-text').textContent = msg;
    document.getElementById('loading-text').style.color = '#f87171';
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"
  onerror="showError('Lỗi: Không load được A-Frame. Kiểm tra kết nối mạng.')"></script>
<script src="https://cdn.jsdelivr.net/npm/@ar-js-org/ar.js@3.4.5/aframe/build/aframe-ar-nft.js"
  onerror="showError('Lỗi: Không load được AR.js.')"></script>

<script>
  window.addEventListener('load', function () {
    if (typeof AFRAME === 'undefined') {
      showError('A-Frame chưa load được. Thử reload trang.');
      return;
    }
    // Tạo scene sau khi A-Frame + AR.js đã load
    var scene = document.createElement('a-scene');
    scene.setAttribute('embedded', '');
    scene.setAttribute('arjs', 'sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;');
    scene.setAttribute('renderer', 'logarithmicDepthBuffer: true; precision: medium;');
    scene.setAttribute('vr-mode-ui', 'enabled: false');
    scene.setAttribute('loading-screen', 'enabled: false');

    // NFT marker
    var nft = document.createElement('a-nft');
    nft.setAttribute('type', 'nft');
    nft.setAttribute('url', '/models/markers/lang-non');
    nft.setAttribute('smooth', 'true');
    nft.setAttribute('smoothCount', '10');
    nft.setAttribute('smoothTolerance', '0.01');
    nft.setAttribute('smoothThreshold', '5');

    // 3D model
    var entity = document.createElement('a-entity');
    entity.setAttribute('gltf-model', '/models/lang-non.glb');
    entity.setAttribute('scale', '0.005 0.005 0.005');
    entity.setAttribute('rotation', '-90 0 0');
    entity.setAttribute('position', '0 0 0');

    nft.appendChild(entity);
    scene.appendChild(nft);

    // Camera
    var cam = document.createElement('a-camera');
    scene.appendChild(cam);

    document.body.appendChild(scene);

    // Ẩn overlay sau 4s dù scene có loaded hay không
    scene.addEventListener('loaded', function () {
      document.getElementById('overlay').classList.add('hidden');
    });
    setTimeout(function () {
      document.getElementById('overlay').classList.add('hidden');
    }, 4000);

    // Marker found/lost
    nft.addEventListener('markerFound', function () {
      var s = document.getElementById('status');
      s.textContent = '✓ Đã nhận diện';
      s.classList.add('found');
    });
    nft.addEventListener('markerLost', function () {
      var s = document.getElementById('status');
      s.textContent = 'Hướng vào diorama';
      s.classList.remove('found');
    });
  });
</script>

</body>
</html>
