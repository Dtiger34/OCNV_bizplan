<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AR · Làng Nón Chuông</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a0a00; overflow: hidden; font-family: sans-serif; height: 100dvh; display: flex; flex-direction: column; }

    #header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
    }
    #header-sub { color: #C9973A; font-size: 9px; letter-spacing: 0.25em; text-transform: uppercase; }
    #header-title { color: #fff; font-size: 14px; font-weight: 500; margin-top: 2px; }
    #btn-back {
      width: 36px; height: 36px; border-radius: 50%;
      background: rgba(0,0,0,0.5); border: none; color: #fff;
      font-size: 18px; cursor: pointer; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
    }

    model-viewer {
      width: 100%; flex: 1;
      --poster-color: #1a0a00;
    }

    /* Nút AR tuỳ chỉnh */
    #ar-button {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #C9973A;
      color: #2C1A0E;
      border: none;
      padding: 14px 32px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(201,151,58,0.4);
      white-space: nowrap;
    }
    #ar-button[hidden] { display: none; }
    #ar-button svg { width: 18px; height: 18px; }

    #guide {
      position: fixed; bottom: 16px; left: 16px; right: 16px; z-index: 50;
      background: rgba(44,26,14,0.92); border: 1px solid rgba(201,151,58,0.4);
      border-radius: 12px; padding: 14px;
    }
    #guide-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    #guide-title { color: #F5EDD6; font-size: 12px; font-weight: 600; }
    #btn-close { background: none; border: none; color: #9C8670; font-size: 18px; cursor: pointer; line-height: 1; }
    #guide-steps { color: #C9B99A; font-size: 11px; line-height: 1.8; }

    #no-ar {
      display: none;
      position: fixed; bottom: 16px; left: 16px; right: 16px;
      background: rgba(44,26,14,0.92); border: 1px solid rgba(201,151,58,0.3);
      border-radius: 12px; padding: 14px; text-align: center;
      color: #9C8670; font-size: 12px; line-height: 1.6;
    }
  </style>
</head>
<body>

<div id="header">
  <div>
    <div id="header-sub">AR · Quick Look</div>
    <div id="header-title">Làng Nón Chuông</div>
  </div>
  <a id="btn-back" href="javascript:history.back()">✕</a>
</div>

<model-viewer
  id="viewer"
  src="/models/lang-non.glb"
  alt="Mô hình 3D Làng Nón Chuông"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate
  auto-rotate-delay="1000"
  shadow-intensity="1"
  environment-image="neutral"
  ar-button-style="none"
>
  <!-- Nút AR tuỳ chỉnh -->
  <button id="ar-button" slot="ar-button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M5 3H3v2M19 3h2v2M5 21H3v-2M19 21h2v-2"/>
      <path d="M12 8l4 2v4l-4 2-4-2v-4l4-2z"/>
    </svg>
    Xem AR trong không gian thực
  </button>
</model-viewer>

<div id="guide">
  <div id="guide-header">
    <span id="guide-title">Cách xem AR</span>
    <button id="btn-close" onclick="document.getElementById('guide').style.display='none'">✕</button>
  </div>
  <div id="guide-steps">
    1. Xoay mô hình bằng cách vuốt màn hình<br/>
    2. Nhấn nút <strong style="color:#C9973A">Xem AR trong không gian thực</strong><br/>
    3. Hướng camera vào sàn hoặc bàn, mô hình sẽ đặt xuống đó
  </div>
</div>

<div id="no-ar">
  Trình duyệt này chưa hỗ trợ AR.<br/>
  Vui lòng dùng <strong>Safari trên iPhone</strong> hoặc <strong>Chrome trên Android</strong>.
</div>

<script>
  var viewer = document.getElementById('viewer');

  viewer.addEventListener('ar-status', function(e) {
    if (e.detail.status === 'not-presenting') {
      document.getElementById('guide').style.display = '';
    }
  });

  // Kiểm tra AR support
  viewer.addEventListener('load', function() {
    if (!viewer.canActivateAR) {
      document.getElementById('ar-button').hidden = true;
      document.getElementById('no-ar').style.display = 'block';
      document.getElementById('guide').style.display = 'none';
    }
  });
</script>

</body>
</html>
