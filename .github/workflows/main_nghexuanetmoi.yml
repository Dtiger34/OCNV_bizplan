# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - nghexuanetmoi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies and build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy

          # Copy BE dist và package.json
          cp -r apps/be/dist deploy/dist
          cp apps/be/package.json deploy/package.json

          # Copy FE dist vào đúng path BE expect
          mkdir -p deploy/fe/dist
          cp -r apps/fe/dist/. deploy/fe/dist/

          # npm install tạo flat node_modules Azure đọc được
          cd deploy && npm install --omit=dev --no-package-lock

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1BE7797BFA0F416C8F76AEACBCBA618C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_442E9341DB614FF88538804DF046B465 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_7A1EBC3149EB4A7BA43881D13C058717 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nghexuanetmoi'
          slot-name: 'Production'
          package: .
